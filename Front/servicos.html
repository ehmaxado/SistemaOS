<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Sistema OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-tools"></i> Sistema OS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="ordens-servico.html">Ordens de Serviço</a></li>
                    <li class="nav-item"><a class="nav-link" href="pessoas.html">Pessoas</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="formas-pagamento.html">Formas de Pagamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="pagamentos.html">Pagamentos</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><span class="navbar-text me-3" id="nomeUsuario"></span></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-wrench"></i> Serviços</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalServico" onclick="novoServico()">
                <i class="bi bi-plus-circle"></i> Novo Serviço
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Valor Padrão</th>
                                <th>Tempo Estimado (min)</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaServicos">
                            <tr><td colspan="5" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Servico -->
    <div class="modal fade" id="modalServico" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalServicoTitle">Novo Serviço</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formServico">
                        <input type="hidden" id="servicoId">
                        <div class="mb-3">
                            <label class="form-label">Descrição *</label>
                            <textarea class="form-control" id="descricao" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Valor Padrão *</label>
                                <input type="number" class="form-control" id="valorPadrao" step="0.01" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tempo Estimado (minutos)</label>
                                <input type="number" class="form-control" id="tempoEstimadoMinutos" value="60">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarServico()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api';
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (!usuario.email) window.location.href = 'index.html';
        document.getElementById('nomeUsuario').textContent = usuario.nome || usuario.email;

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }

        async function carregarServicos() {
            try {
                const response = await fetch(`${API_URL}/servicos`);
                if (response.ok) {
                    const data = await response.json();
                    const servicos = Array.isArray(data) ? data : (data.servicos || []);
                    exibirServicos(servicos);
                }
            } catch (error) {
                console.error('Erro ao carregar serviços:', error);
                document.getElementById('tabelaServicos').innerHTML = 
                    '<tr><td colspan="5" class="text-center text-danger">Erro ao carregar dados</td></tr>';
            }
        }

        function exibirServicos(servicos) {
            const tbody = document.getElementById('tabelaServicos');
            if (!servicos || servicos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum serviço cadastrado</td></tr>';
                return;
            }
            tbody.innerHTML = servicos.map(s => `
                <tr>
                    <td>${s.codigo || '-'}</td>
                    <td>${s.descricao || '-'}</td>
                    <td>R$ ${(s.valorPadrao || 0).toFixed(2)}</td>
                    <td>${s.tempoEstimadoMinutos || 0}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editarServico('${s.id}')" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deletarServico('${s.id}')" title="Excluir">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function novoServico() {
            document.getElementById('modalServicoTitle').textContent = 'Novo Serviço';
            document.getElementById('formServico').reset();
            document.getElementById('servicoId').value = '';
        }

        async function editarServico(id) {
            try {
                const response = await fetch(`${API_URL}/servicos/${id}`);
                if (response.ok) {
                    const data = await response.json();
                    const servico = data.servico || data;
                    document.getElementById('modalServicoTitle').textContent = 'Editar Serviço';
                    document.getElementById('servicoId').value = servico.id;
                    document.getElementById('codigo').value = servico.codigo || '';
                    document.getElementById('descricao').value = servico.descricao || '';
                    document.getElementById('valorPadrao').value = servico.valorPadrao || 0;
                    document.getElementById('tempoEstimadoMinutos').value = servico.tempoEstimadoMinutos || 0;
                    new bootstrap.Modal(document.getElementById('modalServico')).show();
                } else {
                    alert('Erro ao buscar serviço');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao buscar serviço');
            }
        }

        async function salvarServico() {
            const id = document.getElementById('servicoId').value;
            const dados = {
                codigo: document.getElementById('codigo').value,
                descricao: document.getElementById('descricao').value,
                valorPadrao: parseFloat(document.getElementById('valorPadrao').value),
                tempoEstimadoMinutos: parseInt(document.getElementById('tempoEstimadoMinutos').value) || 0
            };

            try {
                const url = id ? `${API_URL}/servicos/${id}` : `${API_URL}/servicos`;
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert(id ? 'Serviço atualizado com sucesso!' : 'Serviço cadastrado com sucesso!');
                    bootstrap.Modal.getInstance(document.getElementById('modalServico')).hide();
                    carregarServicos();
                } else {
                    const erro = await response.json();
                    alert('Erro ao salvar: ' + (erro.mensagem || 'Erro desconhecido'));
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar serviço');
            }
        }

        async function deletarServico(id) {
            if (!confirm('Deseja realmente excluir este serviço?')) return;

            try {
                const response = await fetch(`${API_URL}/servicos/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Serviço excluído com sucesso!');
                    carregarServicos();
                } else {
                    alert('Erro ao excluir serviço');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao excluir serviço');
            }
        }

        carregarServicos();
    </script>
</body>
</html>
