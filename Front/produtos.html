<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Sistema OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-tools"></i> Sistema OS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="ordens-servico.html">Ordens de Serviço</a></li>
                    <li class="nav-item"><a class="nav-link" href="pessoas.html">Pessoas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="formas-pagamento.html">Formas de Pagamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="pagamentos.html">Pagamentos</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><span class="navbar-text me-3" id="nomeUsuario"></span></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-box"></i> Produtos</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProduto" onclick="novoProduto()">
                <i class="bi bi-plus-circle"></i> Novo Produto
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Marca</th>
                                <th>Preço Custo</th>
                                <th>Preço Venda</th>
                                <th>Estoque</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutos">
                            <tr><td colspan="7" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Produto -->
    <div class="modal fade" id="modalProduto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProdutoTitle">Novo Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProduto">
                        <input type="hidden" id="produtoId">
                        <div class="mb-3">
                            <label class="form-label">Nome *</label>
                            <input type="text" class="form-control" id="nome" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marca">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço Custo *</label>
                                <input type="number" class="form-control" id="valorCusto" step="0.01" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço Venda *</label>
                                <input type="number" class="form-control" id="valorVenda" step="0.01" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estoque Atual *</label>
                                <input type="number" class="form-control" id="estoqueAtual" value="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Unidade</label>
                                <input type="text" class="form-control" id="unidade" placeholder="Ex: UN, KG, M">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarProduto()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api';
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (!usuario.email) window.location.href = 'index.html';
        document.getElementById('nomeUsuario').textContent = usuario.nome || usuario.email;

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }

        async function carregarProdutos() {
            try {
                const response = await fetch(`${API_URL}/produtos`);
                if (response.ok) {
                    const data = await response.json();
                    const produtos = Array.isArray(data) ? data : (data.produtos || []);
                    exibirProdutos(produtos);
                }
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                document.getElementById('tabelaProdutos').innerHTML = 
                    '<tr><td colspan="7" class="text-center text-danger">Erro ao carregar dados</td></tr>';
            }
        }

        function exibirProdutos(produtos) {
            const tbody = document.getElementById('tabelaProdutos');
            if (!produtos || produtos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">Nenhum produto cadastrado</td></tr>';
                return;
            }
            tbody.innerHTML = produtos.map(p => `
                <tr>
                    <td>${p.nome || '-'}</td>
                    <td>${p.descricao || '-'}</td>
                    <td>${p.marca || '-'}</td>
                    <td>R$ ${(p.valorCusto || 0).toFixed(2)}</td>
                    <td>R$ ${(p.valorVenda || 0).toFixed(2)}</td>
                    <td>${p.estoqueAtual || 0} ${p.unidade || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editarProduto('${p.id}')" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deletarProduto('${p.id}')" title="Excluir">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function novoProduto() {
            document.getElementById('modalProdutoTitle').textContent = 'Novo Produto';
            document.getElementById('formProduto').reset();
            document.getElementById('produtoId').value = '';
        }

        async function editarProduto(id) {
            try {
                const response = await fetch(`${API_URL}/produtos/${id}`);
                if (response.ok) {
                    const data = await response.json();
                    const produto = data.produto || data;
                    document.getElementById('modalProdutoTitle').textContent = 'Editar Produto';
                    document.getElementById('produtoId').value = produto.id;
                    document.getElementById('nome').value = produto.nome || '';
                    document.getElementById('descricao').value = produto.descricao || '';
                    document.getElementById('marca').value = produto.marca || '';
                    document.getElementById('valorCusto').value = produto.valorCusto || 0;
                    document.getElementById('valorVenda').value = produto.valorVenda || 0;
                    document.getElementById('estoqueAtual').value = produto.estoqueAtual || 0;
                    document.getElementById('unidade').value = produto.unidade || '';
                    new bootstrap.Modal(document.getElementById('modalProduto')).show();
                } else {
                    alert('Erro ao buscar produto');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao buscar produto');
            }
        }

        async function salvarProduto() {
            const id = document.getElementById('produtoId').value;
            const dados = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                marca: document.getElementById('marca').value,
                valorCusto: parseFloat(document.getElementById('valorCusto').value),
                valorVenda: parseFloat(document.getElementById('valorVenda').value),
                estoqueAtual: parseInt(document.getElementById('estoqueAtual').value) || 0,
                unidade: document.getElementById('unidade').value
            };

            try {
                const url = id ? `${API_URL}/produtos/${id}` : `${API_URL}/produtos`;
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert(id ? 'Produto atualizado com sucesso!' : 'Produto cadastrado com sucesso!');
                    bootstrap.Modal.getInstance(document.getElementById('modalProduto')).hide();
                    carregarProdutos();
                } else {
                    const erro = await response.json();
                    alert('Erro ao salvar: ' + (erro.mensagem || 'Erro desconhecido'));
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar produto');
            }
        }

        async function deletarProduto(id) {
            if (!confirm('Deseja realmente excluir este produto?')) return;

            try {
                const response = await fetch(`${API_URL}/produtos/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Produto excluído com sucesso!');
                    carregarProdutos();
                } else {
                    alert('Erro ao excluir produto');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao excluir produto');
            }
        }

        carregarProdutos();
    </script>
</body>
</html>
