<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas - Sistema OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-tools"></i> Sistema OS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="ordens-servico.html">Ordens de Serviço</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pessoas.html">Pessoas</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="formas-pagamento.html">Formas de Pagamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="pagamentos.html">Pagamentos</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><span class="navbar-text me-3" id="nomeUsuario"></span></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people"></i> Pessoas</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPessoa" onclick="novaPessoa()">
                <i class="bi bi-plus-circle"></i> Nova Pessoa
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF/CNPJ</th>
                                <th>Telefone</th>
                                <th>Email</th>
                                <th>Tipo</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaPessoas">
                            <tr><td colspan="6" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pessoa -->
    <div class="modal fade" id="modalPessoa" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPessoaTitle">Nova Pessoa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPessoa">
                        <input type="hidden" id="pessoaId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nome *</label>
                                <input type="text" class="form-control" id="nome" maxlength="100" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPF/CNPJ *</label>
                                <input type="text" class="form-control" id="cpfCnpj" maxlength="14" required 
                                       oninput="this.value = this.value.replace(/\D/g, '')"
                                       placeholder="Somente números (11 ou 14 dígitos)">
                                <small class="text-muted">CPF: 11 dígitos | CNPJ: 14 dígitos</small>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Telefone *</label>
                                <input type="text" class="form-control" id="telefone" maxlength="16" required
                                       placeholder="Ex: (11) 98765-4321">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" maxlength="100">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tipo *</label>
                                <select class="form-select" id="tipoPessoa" required>
                                    <option value="CLIENTE">Cliente</option>
                                    <option value="FUNCIONARIO">Funcionário</option>
                                    <option value="FORNECEDOR">Fornecedor</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">CEP</label>
                                <input type="text" class="form-control" id="cep" maxlength="8"
                                       oninput="this.value = this.value.replace(/\D/g, '')"
                                       placeholder="Somente números">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Número</label>
                                <input type="text" class="form-control" id="numero" maxlength="10">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Logradouro</label>
                                <input type="text" class="form-control" id="logradouro" maxlength="200">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Bairro</label>
                                <input type="text" class="form-control" id="bairro" maxlength="100">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cidade</label>
                                <input type="text" class="form-control" id="cidade" maxlength="100">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estado (UF)</label>
                                <input type="text" class="form-control" id="uf" maxlength="2"
                                       oninput="this.value = this.value.toUpperCase()"
                                       placeholder="Ex: SP">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarPessoa()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (!usuario.email) window.location.href = 'index.html';
        document.getElementById('nomeUsuario').textContent = usuario.nome || usuario.email;

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }

        async function carregarPessoas() {
            try {
                const response = await fetch(`${API_URL}/pessoas`);
                if (response.ok) {
                    const data = await response.json();
                    console.log('Response completo:', data); // Debug
                    const pessoas = data.pessoas || [];
                    console.log('Pessoas extraídas:', pessoas); // Debug
                    exibirPessoas(pessoas);
                }
            } catch (error) {
                console.error('Erro ao carregar pessoas:', error);
                document.getElementById('tabelaPessoas').innerHTML = 
                    '<tr><td colspan="6" class="text-center text-danger">Erro ao carregar dados</td></tr>';
            }
        }

        function exibirPessoas(pessoas) {
            const tbody = document.getElementById('tabelaPessoas');
            if (!pessoas || pessoas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Nenhuma pessoa cadastrada</td></tr>';
                return;
            }
            tbody.innerHTML = pessoas.map(p => `
                <tr>
                    <td>${p.nome || '-'}</td>
                    <td>${p.cpfCnpj || '-'}</td>
                    <td>${p.telefone || '-'}</td>
                    <td>${p.email || '-'}</td>
                    <td>${p.tipoPessoa || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editarPessoa('${p.id}')" data-bs-toggle="modal" data-bs-target="#modalPessoa">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deletarPessoa('${p.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function novaPessoa() {
            document.getElementById('modalPessoaTitle').textContent = 'Nova Pessoa';
            document.getElementById('formPessoa').reset();
            document.getElementById('pessoaId').value = '';
        }

        async function editarPessoa(id) {
            try {
                const response = await fetch(`${API_URL}/pessoas/${id}`);
                if (response.ok) {
                    const pessoa = await response.json();
                    
                    console.log('Pessoa carregada:', pessoa); // Debug
                    
                    document.getElementById('modalPessoaTitle').textContent = 'Editar Pessoa';
                    document.getElementById('pessoaId').value = pessoa.id || '';
                    document.getElementById('nome').value = pessoa.nome || '';
                    document.getElementById('cpfCnpj').value = pessoa.cpfCnpj || '';
                    document.getElementById('telefone').value = pessoa.telefone || '';
                    document.getElementById('email').value = pessoa.email || '';
                    document.getElementById('tipoPessoa').value = pessoa.tipoPessoa || 'CLIENTE';
                    document.getElementById('cep').value = pessoa.cep || '';
                    document.getElementById('logradouro').value = pessoa.logradouro || '';
                    document.getElementById('numero').value = pessoa.numero || '';
                    document.getElementById('bairro').value = pessoa.bairro || '';
                    document.getElementById('cidade').value = pessoa.cidade || '';
                    document.getElementById('uf').value = pessoa.uf || '';
                } else {
                    alert('Erro ao buscar dados da pessoa');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao conectar com o servidor');
            }
        }

        async function salvarPessoa() {
            // Validação dos campos obrigatórios
            const nome = document.getElementById('nome').value.trim();
            const cpfCnpj = document.getElementById('cpfCnpj').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            
            if (!nome) {
                alert('Nome é obrigatório');
                document.getElementById('nome').focus();
                return;
            }
            
            if (nome.length > 100) {
                alert('Nome deve ter no máximo 100 caracteres');
                document.getElementById('nome').focus();
                return;
            }
            
            if (!cpfCnpj) {
                alert('CPF/CNPJ é obrigatório');
                document.getElementById('cpfCnpj').focus();
                return;
            }
            
            if (cpfCnpj.length !== 11 && cpfCnpj.length !== 14) {
                alert('CPF deve ter 11 dígitos ou CNPJ deve ter 14 dígitos');
                document.getElementById('cpfCnpj').focus();
                return;
            }
            
            if (!telefone) {
                alert('Telefone é obrigatório');
                document.getElementById('telefone').focus();
                return;
            }
            
            if (telefone.length > 16) {
                alert('Telefone deve ter no máximo 16 caracteres');
                document.getElementById('telefone').focus();
                return;
            }

            const dados = {
                nome: nome,
                cpfCnpj: cpfCnpj,
                telefone: telefone,
                email: document.getElementById('email').value.trim(),
                tipoPessoa: document.getElementById('tipoPessoa').value,
                cep: document.getElementById('cep').value.trim(),
                numero: document.getElementById('numero').value.trim(),
                logradouro: document.getElementById('logradouro').value.trim(),
                bairro: document.getElementById('bairro').value.trim(),
                cidade: document.getElementById('cidade').value.trim(),
                uf: document.getElementById('uf').value.trim()
            };

            const pessoaId = document.getElementById('pessoaId').value;
            const isEdicao = pessoaId !== '';

            try {
                const url = isEdicao ? `${API_URL}/pessoas/${pessoaId}` : `${API_URL}/pessoas`;
                const method = isEdicao ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(isEdicao ? { id: pessoaId, ...dados } : dados)
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('modalPessoa')).hide();
                    carregarPessoas();
                    alert(isEdicao ? 'Pessoa atualizada com sucesso!' : 'Pessoa criada com sucesso!');
                } else {
                    const error = await response.json();
                    alert('Erro ao salvar pessoa: ' + (error.mensagem || 'Erro desconhecido'));
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao conectar com o servidor');
            }
        }

        async function deletarPessoa(id) {
            if (!confirm('Deseja realmente excluir esta pessoa?')) return;
            
            try {
                const response = await fetch(`${API_URL}/pessoas/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarPessoas();
                    alert('Pessoa excluída com sucesso!');
                } else {
                    alert('Erro ao excluir pessoa');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao conectar com o servidor');
            }
        }

        carregarPessoas();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
